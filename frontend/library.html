<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HookLink | Writing Library</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <!-- ═══ Header Mount ═══ -->
    <div id="header-mount"></div>

    <!-- ═══ Main Content ═══ -->
    <main class="pt-32 pb-unit-xl px-margin-mobile md:px-margin-desktop max-w-[1280px] mx-auto">

      <!-- ── Page Header ── -->
      <section class="mb-12">
        <h1 class="text-headline-xl font-headline font-bold text-on-surface">Writing Ideas Library</h1>
        <p class="mt-4 text-body-lg text-on-surface-variant max-w-2xl leading-relaxed">
          Browse different ways to open your posts. See what works best for your style.
        </p>

        <!-- Search Bar -->
        <div class="mt-8 relative max-w-xl">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 pointer-events-none">search</span>
          <input
            id="searchInput"
            data-testid="library-search-input"
            type="text"
            placeholder="Search for ideas..."
            class="w-full pl-12 pr-4 py-3 rounded-xl border border-outline-variant/40 bg-surface-container-lowest text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition"
          />
        </div>
      </section>

      <!-- ── Filter Tags ── -->
      <section class="mb-10 flex flex-wrap gap-3" id="filterRow">
        <button data-filter="all" data-testid="filter-all" class="filter-pill active px-4 py-2 rounded-xl border border-outline-variant/40 text-body-sm font-semibold transition-all bg-primary text-on-primary">All Ideas</button>
        <button data-filter="curiosity-gap" data-testid="filter-curiosity-gap" class="filter-pill px-4 py-2 rounded-xl border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container hover:border-primary/40">Curiosity-Gap</button>
        <button data-filter="the-listicle" data-testid="filter-the-listicle" class="filter-pill px-4 py-2 rounded-xl border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container hover:border-primary/40">The Listicle</button>
        <button data-filter="the-controversy" data-testid="filter-the-controversy" class="filter-pill px-4 py-2 rounded-xl border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container hover:border-primary/40">The Controversy</button>
        <button data-filter="technical-insight" data-testid="filter-technical-insight" class="filter-pill px-4 py-2 rounded-xl border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container hover:border-primary/40">Technical Insight</button>
      </section>

      <!-- ── Platform Filter ── -->
      <section class="-mt-4 mb-10 flex flex-wrap gap-2" id="platformRow" data-testid="platform-filter-row">
        <button data-platform="all" data-testid="platform-filter-all" class="platform-pill px-3 py-1.5 rounded-full border border-outline-variant/40 text-body-sm font-semibold transition-all bg-on-background text-on-primary">All platforms</button>
        <button data-platform="linkedin" data-testid="platform-filter-linkedin" class="platform-pill flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:border-primary/40"><i class="fa-brands fa-linkedin" style="color:#0A66C2"></i>LinkedIn</button>
        <button data-platform="instagram" data-testid="platform-filter-instagram" class="platform-pill flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:border-primary/40"><i class="fa-brands fa-instagram" style="color:#E1306C"></i>Instagram</button>
        <button data-platform="facebook" data-testid="platform-filter-facebook" class="platform-pill flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:border-primary/40"><i class="fa-brands fa-facebook" style="color:#1877F2"></i>Facebook</button>
        <button data-platform="x" data-testid="platform-filter-x" class="platform-pill flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:border-primary/40"><i class="fa-brands fa-x-twitter" style="color:#0F1419"></i>X</button>
        <button data-platform="threads" data-testid="platform-filter-threads" class="platform-pill flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:border-primary/40"><i class="fa-brands fa-threads" style="color:#101010"></i>Threads</button>
        <button data-platform="tiktok" data-testid="platform-filter-tiktok" class="platform-pill flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:border-primary/40"><i class="fa-brands fa-tiktok" style="color:#FE2C55"></i>TikTok</button>
        <button data-platform="youtube" data-testid="platform-filter-youtube" class="platform-pill flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant/40 text-body-sm font-semibold transition-all bg-surface-container-lowest text-on-surface-variant hover:border-primary/40"><i class="fa-brands fa-youtube" style="color:#FF0000"></i>YouTube</button>
      </section>

      <!-- ── Hook Cards Grid ── -->
      <section id="hookGrid" data-testid="hook-grid" class="grid grid-flow-dense grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter">
      </section>

      <!-- ── Load More ── -->
      <section class="mt-12 text-center">
        <button id="loadMoreBtn" data-testid="load-more-btn" class="px-8 py-3 rounded-xl border-2 border-outline-variant/40 text-body-md font-semibold text-on-surface-variant hover:border-primary hover:text-primary hover:bg-primary-fixed/10 transition-all active:scale-95">
          Load More Ideas
        </button>
        <p id="viewingCount" data-testid="viewing-count" class="mt-4 text-body-sm text-on-surface-variant/60"></p>
      </section>

      <!-- ── Newsletter CTA ── -->
      <section class="mt-20 bg-surface-container rounded-2xl p-8 md:p-12 text-center border border-outline-variant/30">
        <span class="material-symbols-outlined text-[40px] text-primary mb-4">mail</span>
        <h2 class="text-headline-md font-headline font-bold text-on-surface mb-3">Get Fresh Ideas Weekly</h2>
        <p class="text-body-md text-on-surface-variant max-w-lg mx-auto mb-8">
          Join the community receiving fresh writing prompts every Monday. Unsubscribe anytime.
        </p>
        <form id="newsletterForm" data-testid="newsletter-form" class="flex flex-col sm:flex-row gap-3 justify-center max-w-md mx-auto">
          <input
            type="email"
            id="newsletterEmail"
            data-testid="newsletter-email-input"
            required
            placeholder="you@example.com"
            class="flex-1 px-4 py-3 rounded-xl border border-outline-variant/40 bg-surface-container-lowest text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition"
          />
          <button type="submit" id="joinBtn" data-testid="newsletter-join-btn" class="bg-primary text-on-primary px-6 py-3 rounded-xl font-semibold text-body-sm tracking-wider hover:shadow-lg transition-all active:scale-95 whitespace-nowrap">
            Join Free
          </button>
        </form>
      </section>

    </main>

    <!-- ═══ Footer Mount ═══ -->
    <div id="footer-mount"></div>

    <script type="module" src="/src/js/library.js"></script>
  </body>
</html>
